{% extends "base.html" %}
{% block title %}Nueva orden{% endblock %}
{% block content %}
<h2>Nueva orden de servicio</h2>
<form method="post" action="/ordenes/" class="form-grid">
  <fieldset>
    <legend>Cliente</legend>
    <label>Nombre
      <input name="name" required />
    </label>
    <label>Teléfono (E.164)
      <input name="phone_e164" placeholder="57XXXXXXXXXX" required />
    </label>
    <label>Email
      <input name="email" type="email" />
    </label>
    <label>Documento
      <input name="document" />
    </label>
    <label>Dirección
      <input name="address" />
    </label>
  </fieldset>

  <fieldset>
    <legend>Equipo</legend>
    <label>Tipo
      <select name="device_type" required>
        <option value="computador">Computador</option>
        <option value="impresora">Impresora</option>
        <option value="otro">Otro</option>
      </select>
    </label>
    <label>Marca
      <input name="brand" />
    </label>
    <label>Modelo
      <input name="model" />
    </label>
    <label>Serie
      <input name="serial" />
    </label>
    <label>Accesorios
      <input name="accessories" />
    </label>
    <label>Estado físico
      <input name="physical_condition" />
    </label>
    <label>Observaciones
      <textarea name="observations"></textarea>
    </label>
  </fieldset>

  <fieldset>
    <legend>Recepción</legend>
    <label>Falla reportada
      <textarea name="issue_description" required></textarea>
    </label>
    <label>Contraseña (si aplica)
      <input name="password" />
    </label>
    <label>Valor estimado (opcional)
      <input name="estimate_amount" type="number" step="0.01" />
    </label>
  </fieldset>

  <button type="submit">Guardar y enviar WhatsApp</button>
</form>
{% endblock %}
